events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    # Docker's embedded DNS (always 127.0.0.11) -- used instead of a
    # static `upstream { server backend:8000; }` block. An `upstream`
    # block's hostname is only ever resolved once, at nginx startup/
    # reload; when `docker compose up --build` later recreates the
    # backend/frontend containers (a normal deploy), they get new
    # internal IPs, but this nginx container -- typically untouched by
    # that same deploy, since its image rarely changes -- keeps proxying
    # to the old, now-dead IP until it's manually restarted too, which
    # is exactly what produced a 502 Bad Gateway here (2026-10-01):
    # every other container was fresh, nginx had been up for 5 weeks.
    # Putting the proxy target in a variable (set below, per location)
    # forces nginx to re-resolve the hostname through this resolver on
    # every request instead of caching the first lookup forever, so a
    # future container replacement no longer needs a matching nginx
    # restart to pick it up.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # Django API + admin + WhiteNoise-served static/admin assets --
        # all handled by gunicorn inside the backend container.
        location ~ ^/(api|admin|static)/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> the Next.js app.
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
